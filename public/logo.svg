<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 440 440">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4fa8"/>
      <stop offset="1" stop-color="#1c2560"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#efe4c8"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c79c"/>
      <stop offset="1" stop-color="#b59f6a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8402f"/>
      <stop offset="1" stop-color="#a5161b"/>
    </linearGradient>
  </defs>
  <!-- tile lying behind, face down -->
  <g transform="rotate(14 330 260)">
    <rect x="232" y="78" width="210" height="290" rx="34" fill="#141a45"/>
    <rect x="232" y="64" width="210" height="290" rx="34" fill="url(#back)"/>
    <rect x="254" y="86" width="166" height="246" rx="22" fill="none" stroke="#d9b45a" stroke-width="6" opacity="0.7"/>
  </g>
  <!-- front tile -->
  <g transform="rotate(-8 200 280)">
    <rect x="78" y="120" width="250" height="340" rx="40" fill="url(#side)"/>
    <rect x="78" y="100" width="250" height="340" rx="40" fill="url(#face)"/>
    <rect x="78" y="100" width="250" height="340" rx="40" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="4"/>
    <!-- 川: three strokes -->
    <g fill="none" stroke="url(#ink)" stroke-linecap="round" stroke-width="34">
      <path d="M150 180 q6 140 -46 216"/>
      <path d="M204 206 q4 70 0 140"/>
      <path d="M258 172 q6 120 0 236"/>
    </g>
  </g>
</svg>
